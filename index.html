<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>김해율하TV</title>

  <!-- PWA -->
  <meta name="theme-color" content="#1e3a8a">
  <link rel="manifest" href="manifest.json">

  <!-- iOS 홈 화면 앱 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="김해율하TV">
  <link rel="apple-touch-icon" href="icon-192.png">

  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

  <style>
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      background: #1e3a8a;
      overscroll-behavior: none;
    }
    /* 앱(Apps Script)을 전체화면 iframe으로 표시 */
    #app-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
    /* 초기 로딩 스플래시 (파란색) */
    #splash {
      position: fixed; inset: 0; z-index: 10;
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #3b82f6 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", sans-serif;
      transition: opacity 0.4s;
      text-align: center;
      padding: 1.5rem;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    /* 흰색 둥근 타일에 로고를 올려 검정 배경이 안 보이도록 */
    #splash .logo-tile {
      width: 96px; height: 96px;
      background: #fff;
      border-radius: 24px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 12px 32px rgba(0,0,0,0.25);
      margin-bottom: 1.2rem;
    }
    #splash .logo-tile img { width: 72px; height: 72px; object-fit: contain; }
    #splash h1 { font-size: 1.35rem; font-weight: 800; letter-spacing: -0.3px; margin: 0; }
    #splash p { font-size: 0.82rem; opacity: 0.9; margin: 8px 0 0; line-height: 1.5; }
    .spinner {
      margin-top: 1.6rem;
      width: 34px; height: 34px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div id="splash">
    <div class="logo-tile">
      <img src="https://lh3.googleusercontent.com/d/1tSnOUP4wDuDkDcHEz1-Yv51mis4S0Ql7" alt="김해율하고등학교 로고">
    </div>
    <h1>김해율하TV</h1>
    <p>대학입시 일정 · 진로진학 AI · 율하TV</p>
    <div class="spinner"></div>
  </div>

  <!-- 실제 앱: Apps Script 웹앱 exec 주소 -->
  <iframe id="app-frame"
          src="https://script.google.com/macros/s/AKfycbyRjT2r_bukrSTe0QSk4TZb3Bb-41Ja6O1C-wwWzVxx5lCjf1S7lKygRNWwEOns-Tbc/exec"
          allow="autoplay; encrypted-media; fullscreen; clipboard-read; clipboard-write"
          referrerpolicy="no-referrer-when-downgrade"></iframe>

  <script>
    var frame  = document.getElementById('app-frame');
    var splash = document.getElementById('splash');
    function hideSplash() { splash.classList.add('hide'); }
    frame.addEventListener('load', function () { setTimeout(hideSplash, 500); });
    setTimeout(hideSplash, 7000);

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function (e) {
          console.log('SW 등록 실패:', e);
        });
      });
    }
  </script>
</body>
</html>
