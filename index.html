<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="김해율하고등학교 진로진학 AI 캘린더">
    <meta name="theme-color" content="#2E4B8E">
    
    <title>김해율하고 진로진학 AI</title>
    
    <!-- PWA 설정 -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #2E4B8E 0%, #4A6FA5 100%);
        }
        .loader {
            text-align: center;
            color: white;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            margin: 0;
            font-size: 20px;
            font-weight: 500;
        }
        p {
            margin: 10px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h2>김해율하고 진로진학 AI</h2>
        <p>로딩 중...</p>
    </div>
    
    <script>
        // 서비스 워커 등록
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker 등록 성공:', reg))
                .catch(err => console.log('Service Worker 등록 실패:', err));
        }
        
        // GAS 앱으로 리다이렉트
        window.location.href = 'https://script.google.com/macros/s/AKfycbyRjT2r_bukrSTe0QSk4TZb3Bb-41Ja6O1C-wwWzVxx5lCjf1S7lKygRNWwEOns-Tbc/exec';
    </script>
</body>
</html>
